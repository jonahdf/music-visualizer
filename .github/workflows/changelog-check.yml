name: Changelog Check

on:
  pull_request:
    branches: [main, master]

jobs:
  check-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md was updated
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^CHANGELOG\.md$'; then
            echo "✓ CHANGELOG.md was updated in this PR"
          else
            echo "❌ CHANGELOG.md was not updated in this PR."
            echo ""
            echo "Please add an entry to CHANGELOG.md describing the changes in this pull request."
            echo "Format: - **type:** Description ([#N](PR_URL))"
            echo "Types: feat, fix, refactor, perf, docs, chore"
            exit 1
          fi
